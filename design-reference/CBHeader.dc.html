<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--line);position:relative;z-index:2">
<div style="display:flex;align-items:center;gap:2px;min-width:0">
<sc-if value="{{back}}" hint-placeholder-val="{{false}}"><button aria-label="Voltar" style="width:44px;height:44px;margin-left:-14px;border:0;background:transparent;color:var(--tx);display:grid;place-items:center;cursor:pointer;border-radius:999px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button></sc-if>
<div style="font-family:Fraunces,serif;font-variation-settings:'SOFT' 100,'opsz' 48;font-size:21px;font-weight:450;letter-spacing:-.01em;color:var(--tx);display:flex;align-items:baseline;white-space:nowrap">Casa<span style="font-style:italic;margin-left:.24em">Bernard</span><span style="display:inline-block;width:.46em;height:.54em;border-radius:50% 50% 50% 50% / 56% 56% 44% 44%;background:var(--rose);position:relative;margin-left:.05em"><span style="position:absolute;left:50%;top:100%;width:1px;height:.3em;background:var(--gold)"></span></span></div>
</div>
<div style="display:flex;align-items:center;gap:2px">
<div role="group" aria-label="Tema" style="display:flex;padding:3px;border:1px solid var(--line);border-radius:999px;gap:2px">
<span style="width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:{{sunBg}};color:var(--tx)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M2.5 12h2M19.5 12h2M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></span>
<span style="width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:{{moonBg}};color:var(--tx)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a7.5 7.5 0 1 0 10.5 10.5z"></path></svg></span>
</div>
<button aria-label="Menu" style="width:44px;height:44px;border:0;background:transparent;color:var(--tx);display:grid;place-items:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 9h16M8 15h12"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:66},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;back&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const d = !!this.props.dark;
    return { back: !!this.props.back, sunBg: d ? 'transparent' : 'var(--blush)', moonBg: d ? 'var(--blush)' : 'transparent' };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:var(--sf);border-radius:28px;padding:10px 10px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px;height:100%;box-sizing:border-box;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s" style-hover="transform:translateY(-4px)">
<div style="position:relative;aspect-ratio:4/5;border-radius:999px 999px 18px 18px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--line) 0 1px,transparent 1px 10px),linear-gradient(180deg,var(--soft),var(--blush));display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;box-sizing:border-box">
<div style="position:absolute;inset:7px;border:1px solid var(--gold);opacity:.55;border-radius:999px 999px 13px 13px"></div>
<span style="position:relative;font:500 9.5px/1 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);background:var(--sf);padding:6px 10px;border-radius:999px;text-align:center">Foto · {{p.photo}}</span>
</div>
<div style="padding:0 6px;display:flex;flex-direction:column;gap:5px;flex:1">
<div style="font-family:Fraunces,serif;font-variation-settings:'SOFT' 100;font-size:18px;line-height:1.15;font-weight:450;color:var(--tx);text-wrap:pretty">{{p.name}}</div>
<div style="display:flex;flex-direction:column;gap:1px"><span style="font:400 11.5px 'DM Sans',sans-serif;color:var(--tx2)">{{p.prefix}}</span><span style="font:600 15px 'DM Sans',sans-serif;color:var(--tx)">{{p.price}}</span></div>
<div style="font:400 12.5px/1.45 'DM Sans',sans-serif;color:var(--tx2);text-wrap:pretty">{{p.desc}}</div>
</div>
<div style="display:flex;gap:6px">
<button style="flex:1;min-width:0;height:48px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--tx);font:600 13px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap">Ver detalhes</button>
<button aria-label="Pedir pelo WhatsApp" style="flex:none;width:48px;height:48px;border-radius:999px;border:0;background:var(--rose);color:var(--onrose);display:grid;place-items:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5l1.2-3.7a8 8 0 1 1 2.9 2.6z"></path><path d="M9.3 9.2c.2 2.6 2.6 5.1 5.4 5.4l.9-1.3-1.7-.9-.8.6a4 4 0 0 1-2.1-2.1l.6-.8-.9-1.7z"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:480},&quot;p&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;name&quot;:&quot;Bubble personalizado&quot;,&quot;prefix&quot;:&quot;A partir de&quot;,&quot;price&quot;:&quot;R$ 39,90&quot;,&quot;desc&quot;:&quot;Balão transparente com nome e mini balões.&quot;,&quot;photo&quot;:&quot;bubble balloon&quot;},&quot;tsType&quot;:&quot;{name:string,prefix:string,price:string,desc:string,photo:string}&quot;}}"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <link rel="apple-touch-icon" href="/brand/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8F6" />
    <meta name="description" content="Um abraço, Bernardo — flores, ursos e presentes em forma de abraço. Montados à mão e entregues no Grajaú e região." />
    <title>Um abraço, Bernardo · Flores, ursos e presentes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..700;1,5..1200,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,200..700;1,9..40,200..700&family=Dancing+Script:wght@400..600&family=Leckerli+One&display=swap" rel="stylesheet" />
    <script>
      try {
        // tema claro por padrão; escuro só se o usuário escolheu
        document.documentElement.dataset.theme = localStorage.getItem('uab-theme') === 'dark' ? 'dark' : 'light';
        // paleta e fontes escolhidas na última visita (ver src/theme/styles.ts)
        var saved = JSON.parse(localStorage.getItem('uab-vars') || 'null');
        if (saved) {
          for (var k in saved.vars) document.documentElement.style.setProperty(k, saved.vars[k]);
          var l = document.createElement('link');
          l.rel = 'stylesheet'; l.href = saved.href; l.dataset.font = saved.href;
          document.head.appendChild(l);
        }
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
